services:
  mongo:
    image: mongo:8.0
    container_name: mongo-demo
    ports:
      - "27018:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}).ok }'"]
      interval: 3s
      timeout: 5s
      retries: 5